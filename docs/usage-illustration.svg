<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="58%" r="46%">
      <stop offset="0%" stop-color="#4a1811" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#2a0f0c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a0f0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <filter id="glowHub" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowNode" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowDot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <!-- Spoke gradients: warm at the hub end, cool at the device end -->
    <linearGradient id="spokeScreen" gradientUnits="userSpaceOnUse" x1="500" y1="420" x2="500" y2="299">
      <stop offset="0%" stop-color="#ff8a63"/><stop offset="100%" stop-color="#7fe0f2"/>
    </linearGradient>
    <linearGradient id="spokeLapR" gradientUnits="userSpaceOnUse" x1="500" y1="420" x2="830" y2="330">
      <stop offset="0%" stop-color="#ff8a63"/><stop offset="100%" stop-color="#7fe0f2"/>
    </linearGradient>
    <linearGradient id="spokeLapL" gradientUnits="userSpaceOnUse" x1="500" y1="420" x2="185" y2="340">
      <stop offset="0%" stop-color="#ff8a63"/><stop offset="100%" stop-color="#7fe0f2"/>
    </linearGradient>
    <linearGradient id="spokePhoneR" gradientUnits="userSpaceOnUse" x1="500" y1="420" x2="760" y2="590">
      <stop offset="0%" stop-color="#ff8a63"/><stop offset="100%" stop-color="#7fe0f2"/>
    </linearGradient>
    <linearGradient id="spokePhoneC" gradientUnits="userSpaceOnUse" x1="500" y1="420" x2="500" y2="630">
      <stop offset="0%" stop-color="#ff8a63"/><stop offset="100%" stop-color="#7fe0f2"/>
    </linearGradient>
    <linearGradient id="spokePhoneL" gradientUnits="userSpaceOnUse" x1="500" y1="420" x2="250" y2="585">
      <stop offset="0%" stop-color="#ff8a63"/><stop offset="100%" stop-color="#7fe0f2"/>
    </linearGradient>

    <!-- Hub texture: hazard tape + scanline grille (same visual language as faces/kai.js) -->
    <pattern id="hubHazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#ff6a45" opacity="0.5"/>
    </pattern>
    <pattern id="hubScanlines" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="2" fill="#ff6a45" opacity="0.08"/>
    </pattern>
    <pattern id="nodeScanlines" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="2" fill="#7fe0f2" opacity="0.07"/>
    </pattern>

    <!-- Hub face: real Kai proportions, hazard bar + mount tabs, near-square shell, scanline
         texture, single glowing visor bar, mouth as an 11-pixel stern arc (matching the actual
         mouthParams.curve in faces/kai.js). Nested into a laptop shell below, like every node. -->
    <g id="hubFace">
      <g transform="translate(-130,-136)">
        <rect x="40" y="0" width="180" height="8" fill="url(#hubHazard)"/>
        <rect x="56" y="10" width="22" height="9" fill="#ff6a45" opacity="0.6"/>
        <rect x="182" y="10" width="22" height="9" fill="#ff6a45" opacity="0.6"/>
        <rect x="14" y="22" width="232" height="228" rx="3" fill="#0a0a0c" stroke="#ff6a45" stroke-width="5"/>
        <rect x="26" y="34" width="208" height="204" rx="1" fill="#120608" stroke="#ff6a45" stroke-width="1.5" opacity="0.55"/>
        <rect x="26" y="34" width="208" height="204" rx="1" fill="url(#hubScanlines)"/>
        <rect x="58" y="118" width="144" height="18" rx="2" fill="#1a0a0a" stroke="#ff6a45" stroke-width="1" opacity="0.6"/>
        <rect x="58" y="118" width="144" height="18" rx="2" fill="#ff6a45" filter="url(#glowHub)"/>
        <g fill="#ff6a45" filter="url(#glowHub)">
          <rect x="84" y="186" width="8" height="8" rx="1"/>
          <rect x="92.4" y="183.22" width="8" height="8" rx="1"/>
          <rect x="100.8" y="180.71" width="8" height="8" rx="1"/>
          <rect x="109.2" y="178.72" width="8" height="8" rx="1"/>
          <rect x="117.6" y="177.44" width="8" height="8" rx="1"/>
          <rect x="126" y="177" width="8" height="8" rx="1"/>
          <rect x="134.4" y="177.44" width="8" height="8" rx="1"/>
          <rect x="142.8" y="178.72" width="8" height="8" rx="1"/>
          <rect x="151.2" y="180.71" width="8" height="8" rx="1"/>
          <rect x="159.6" y="183.22" width="8" height="8" rx="1"/>
          <rect x="168" y="186" width="8" height="8" rx="1"/>
        </g>
      </g>
    </g>

    <!-- Node face: real Ava proportions, 4 bezel nubs + 2 bridge lines, rounded shell, scanline
         texture, two 4-pixel eye columns, mouth as an 11-pixel smile arc. Used small enough (see
         the different <use> scales below) to actually fit inside its device's own screen. -->
    <g id="nodeFace">
      <g transform="translate(-130,-132)">
        <g fill="#7fe0f2" opacity="0.5">
          <rect x="58" y="2" width="18" height="11" rx="2"/>
          <rect x="92" y="2" width="10" height="11" rx="2"/>
          <rect x="158" y="2" width="10" height="11" rx="2"/>
          <rect x="184" y="2" width="18" height="11" rx="2"/>
        </g>
        <g stroke="#7fe0f2" stroke-width="2" opacity="0.35">
          <line x1="76" y1="7" x2="92" y2="7"/>
          <line x1="168" y1="7" x2="184" y2="7"/>
        </g>
        <rect x="18" y="20" width="224" height="224" rx="20" fill="#0d0f16" stroke="#7fe0f2" stroke-width="4"/>
        <rect x="30" y="32" width="200" height="200" rx="12" fill="#05141a" stroke="#7fe0f2" stroke-width="1.5" opacity="0.5"/>
        <rect x="30" y="32" width="200" height="200" rx="12" fill="url(#nodeScanlines)"/>
        <g fill="#7fe0f2" filter="url(#glowNode)">
          <rect x="80" y="100" width="10" height="10" rx="2"/>
          <rect x="80" y="113" width="10" height="10" rx="2"/>
          <rect x="80" y="126" width="10" height="10" rx="2"/>
          <rect x="80" y="139" width="10" height="10" rx="2"/>
          <rect x="171" y="100" width="10" height="10" rx="2"/>
          <rect x="171" y="113" width="10" height="10" rx="2"/>
          <rect x="171" y="126" width="10" height="10" rx="2"/>
          <rect x="171" y="139" width="10" height="10" rx="2"/>
        </g>
        <g fill="#7fe0f2" filter="url(#glowNode)">
          <rect x="86" y="170" width="8" height="8" rx="2"/>
          <rect x="94" y="174.94" width="8" height="8" rx="2"/>
          <rect x="102" y="179.41" width="8" height="8" rx="2"/>
          <rect x="110" y="182.94" width="8" height="8" rx="2"/>
          <rect x="118" y="185.22" width="8" height="8" rx="2"/>
          <rect x="126" y="186" width="8" height="8" rx="2"/>
          <rect x="134" y="185.22" width="8" height="8" rx="2"/>
          <rect x="142" y="182.94" width="8" height="8" rx="2"/>
          <rect x="150" y="179.41" width="8" height="8" rx="2"/>
          <rect x="158" y="174.94" width="8" height="8" rx="2"/>
          <rect x="166" y="170" width="8" height="8" rx="2"/>
        </g>
      </g>
    </g>

    <!-- Laptop shell -->
    <g id="laptop">
      <rect x="-108" y="-56" width="216" height="138" rx="11" fill="url(#shell)" stroke="#33363c" stroke-width="2"/>
      <rect x="-92" y="-40" width="184" height="102" rx="5" fill="#0e0e12"/>
      <rect x="-126" y="60" width="252" height="15" rx="7" fill="#1c1e22"/>
    </g>

    <!-- Phone shell -->
    <g id="phone">
      <rect x="-34" y="-64" width="68" height="128" rx="14" fill="url(#shell)" stroke="#33363c" stroke-width="2.5"/>
      <rect x="-26" y="-54" width="52" height="100" rx="7" fill="#0e0e12"/>
    </g>
  </defs>

  <rect width="1000" height="700" fill="#07070a"/>
  <rect width="1000" height="700" fill="url(#hubGlow)"/>

  <!-- spokes: hub to every device, straight lines only, nothing device-to-device -->
  <g stroke-width="1.8" opacity="0.6" fill="none">
    <line x1="500" y1="420" x2="500" y2="299" stroke="url(#spokeScreen)"/>
    <line x1="500" y1="420" x2="830" y2="330" stroke="url(#spokeLapR)"/>
    <line x1="500" y1="420" x2="185" y2="340" stroke="url(#spokeLapL)"/>
    <line x1="500" y1="420" x2="760" y2="590" stroke="url(#spokePhoneR)"/>
    <line x1="500" y1="420" x2="500" y2="630" stroke="url(#spokePhoneC)"/>
    <line x1="500" y1="420" x2="250" y2="585" stroke="url(#spokePhoneL)"/>
  </g>

  <!-- pulses: the hub dispatching to each device, staggered -->
  <g fill="#ffe8d9" filter="url(#glowDot)">
    <circle r="3" opacity="0.9"><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M500,420 L500,299"/></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.1s" begin="0.4s" repeatCount="indefinite" path="M500,420 L830,330"/></circle>
    <circle r="3" opacity="0.9"><animateMotion dur="3.3s" begin="0.9s" repeatCount="indefinite" path="M500,420 L185,340"/></circle>
    <circle r="2.6" opacity="0.9"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M500,420 L760,590"/></circle>
    <circle r="2.6" opacity="0.9"><animateMotion dur="2.9s" begin="0.2s" repeatCount="indefinite" path="M500,420 L500,630"/></circle>
    <circle r="2.6" opacity="0.9"><animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M500,420 L250,585"/></circle>
  </g>

  <!-- shared display: connects to hub like every other node. A small node face sits top-left,
       presenting a chart beside it, like an agent walking through it. -->
  <g transform="translate(500,145)">
    <rect x="-8" y="128" width="16" height="18" rx="3" fill="#232329"/>
    <rect x="-58" y="144" width="116" height="10" rx="5" fill="#1a1a1f"/>
    <rect x="-195" y="-118" width="390" height="242" rx="16" fill="url(#shell)" stroke="#40404a" stroke-width="2.5"/>
    <rect x="-175" y="-98" width="350" height="196" rx="8" fill="#0d0d10"/>

    <g transform="translate(-135,-50) scale(0.22)">
      <use href="#nodeFace"/>
    </g>

    <line x1="-92" y1="55" x2="162" y2="55" stroke="#33363c" stroke-width="1"/>
    <g>
      <rect x="-88" y="15" width="26" height="40" fill="#7fe0f2" opacity="0.85"/>
      <rect x="-44" y="-3" width="26" height="58" fill="#ff6a45" opacity="0.85"/>
      <rect x="0" y="5" width="26" height="50" fill="#7fe0f2" opacity="0.85"/>
      <rect x="44" y="-17" width="26" height="72" fill="#ff6a45" opacity="0.85"/>
      <rect x="88" y="-9" width="26" height="64" fill="#7fe0f2" opacity="0.85"/>
      <rect x="132" y="-30" width="26" height="85" fill="#ff6a45" opacity="0.85"/>
    </g>
    <path d="M-75,15 L-31,-3 L13,5 L57,-17 L101,-9 L145,-30" fill="none" stroke="#eceef2" stroke-width="2" opacity="0.85" stroke-linejoin="round"/>
    <g fill="#eceef2" opacity="0.9">
      <circle cx="-75" cy="15" r="2.5"/>
      <circle cx="-31" cy="-3" r="2.5"/>
      <circle cx="13" cy="5" r="2.5"/>
      <circle cx="57" cy="-17" r="2.5"/>
      <circle cx="101" cy="-9" r="2.5"/>
      <circle cx="145" cy="-30" r="2.5"/>
    </g>
  </g>

  <!-- hub: same laptop shell as every node, just bigger, with the red hub face nested inside
       instead of a node's cyan one -->
  <g transform="translate(500,420) scale(1.0)">
    <use href="#laptop"/>
    <g transform="translate(0,4) scale(0.3)"><use href="#hubFace"/></g>
  </g>

  <!-- right laptop node -->
  <g transform="translate(830,330) scale(0.95)">
    <use href="#laptop"/>
    <g transform="scale(0.4)"><use href="#nodeFace"/></g>
  </g>

  <!-- left laptop node -->
  <g transform="translate(185,340) scale(0.85)" opacity="0.92">
    <use href="#laptop"/>
    <g transform="scale(0.4)"><use href="#nodeFace"/></g>
  </g>

  <!-- phones: any device can be a node, node face used MUCH smaller here so it actually fits
       inside the phone's own screen instead of overflowing it -->
  <g transform="translate(760,590) scale(0.85)">
    <use href="#phone"/>
    <g transform="scale(0.2)"><use href="#nodeFace"/></g>
  </g>
  <g transform="translate(500,630) scale(0.8)">
    <use href="#phone"/>
    <g transform="scale(0.2)"><use href="#nodeFace"/></g>
  </g>
  <g transform="translate(250,585) scale(0.85)">
    <use href="#phone"/>
    <g transform="scale(0.2)"><use href="#nodeFace"/></g>
  </g>

  <rect x="472" y="330" width="56" height="20" rx="4" fill="#07070a"/>
  <text x="500" y="345" text-anchor="middle" font-size="14" fill="#c9847a" letter-spacing="0.5" font-weight="600">HUB</text>
  <text x="500" y="18" text-anchor="middle" font-size="13" fill="#7fa3b0" letter-spacing="0.5" font-weight="600" opacity="0.85">SHARED DISPLAY</text>
</svg>
