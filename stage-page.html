<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent</title>
<style>
  /* The page the browser overlay is meant to be opened on: deliberately black and empty, because
     the face (injected by the Tampermonkey userscript) is what you are supposed to look at.
     The only thing living here is the file drop rail below.

     Placement is bottom-LEFT on purpose. The overlay occupies the rest: the face is centred while
     idle and moves to top-left while presenting, and the microphone button sits bottom-right.
     Bottom-left is the one corner nothing else claims.

     The overlay sits above this page (z-index 2147483647) but is pointer-events:none with no
     background, so this rail stays both visible and clickable underneath it. During a presentation
     the overlay's iframe covers the whole viewport, which hides the rail -- correct, nobody drops
     files mid-presentation. */
  html, body { margin: 0; height: 100%; background: #000; }
  /* The hidden attribute loses to any display rule of the element's own (display:flex on the setup box
     and the fullscreen button) -- found in the browser, where the code field stayed after setup. */
  [hidden] { display: none !important; }

  #drop-rail {
    position: fixed; left: 18px; bottom: 18px; z-index: 1000;
    display: flex; flex-direction: column-reverse; gap: 8px;
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    max-height: calc(100vh - 36px); overflow: hidden;
  }
  #drop-rail.hidden { display: none; }

  .rail-title {
    color: #6d7484; font-size: .72rem; letter-spacing: .09em; text-transform: uppercase;
    padding-left: 2px; margin-bottom: 2px; transition: color .2s;
  }
  #drop-rail:hover .rail-title, #drop-rail.dragging .rail-title { color: #aab1c0; }

  .agent {
    width: 208px; background: rgba(23,26,33,.82); border: 1px solid #2b2e38;
    border-radius: 9px; padding: .55rem .7rem; cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .agent:hover { border-color: #7fd1e8; background: rgba(23,26,33,.96); }
  .agent.over { border-color: #7fd1e8; background: rgba(127,209,232,.16); transform: scale(1.02); }
  /* While a file is being dragged anywhere over the window every target lights up, so it is
     obvious where it can go -- the alternative is a rail nobody notices until told about it. */
  #drop-rail.dragging .agent { border-color: #4a5262; background: rgba(23,26,33,.96); }
  .agent.off { opacity: .45; cursor: not-allowed; }
  .agent.off:hover { border-color: #2b2e38; background: rgba(23,26,33,.82); }

  .name { color: #e9ebf0; font-size: .88rem; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7a8; flex: none; }
  .agent.off .dot { background: #6d7484; }
  .hint { color: #6d7484; font-size: .73rem; margin-top: .15rem; }
  .status { font-size: .73rem; margin-top: .2rem; min-height: 1.1em; }
  .status.go { color: #7fd1e8; }
  .status.ok { color: #6ee7a8; }
  .status.bad { color: #ff8a5c; }

  input[type=file] { display: none; }

  /* -- Typing to an agent ---------------------------------------------------------------------
     For links, exact wording, or simply being quiet. Opens above the rail, one at a time. */
  .row { display: flex; align-items: center; gap: .4rem; margin-top: .35rem; }
  .chat-btn {
    border: 1px solid #2b2e38; background: rgba(23,26,33,.9); color: #99a0ae;
    border-radius: 6px; font-size: .72rem; padding: .12rem .45rem; cursor: pointer;
    font-family: inherit; transition: border-color .15s, color .15s;
  }
  .chat-btn:hover { border-color: #7fd1e8; color: #e9ebf0; }
  .agent.off .chat-btn { opacity: .5; cursor: not-allowed; }
  /* A node's face page has no agent list (that is the hub's), so its one chat box -- for the agent of
     this device -- opens from here. Same corner as the hub's list, which a node never shows. */
  /* Topmost layer, like the fullscreen button: it has to stay usable while something is presented -- the
     moment the owner most wants to say something. See keepAboveOverlay. */
  #self-chat-btn { position: fixed; left: 18px; bottom: 18px; z-index: 2147483647; font-size: .85rem; padding: .35rem .8rem; font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }

  #chat {
    position: fixed; left: 18px; bottom: 18px; z-index: 2147483647;
    width: 380px; max-width: calc(100vw - 36px); height: min(460px, calc(100vh - 36px));
    background: #12151b; border: 1px solid #2b2e38; border-radius: 11px;
    display: none; flex-direction: column; overflow: hidden;
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #chat.open { display: flex; }
  .chat-head {
    display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem;
    border-bottom: 1px solid #2b2e38; color: #e9ebf0; font-size: .9rem; font-weight: 600;
  }
  .chat-head .close {
    margin-left: auto; background: none; border: 0; color: #99a0ae; cursor: pointer;
    font-size: 1.1rem; line-height: 1; padding: 0 .2rem; font-family: inherit;
  }
  .chat-head .close:hover { color: #e9ebf0; }
  .chat-log { flex: 1; overflow-y: auto; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .5rem; }
  .msg { font-size: .85rem; line-height: 1.45; max-width: 88%; padding: .4rem .6rem; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { align-self: flex-end; background: #1d3a44; color: #d9f2fa; }
  .msg.agent { align-self: flex-start; background: #1c2029; color: #e9ebf0; }
  .msg.system { align-self: center; background: none; color: #ff8a5c; font-size: .78rem; }
  .msg.pending { opacity: .55; font-style: italic; }
  .chat-empty { color: #6d7484; font-size: .8rem; text-align: center; margin: auto; padding: 1rem; }
  .chat-input { display: flex; gap: .5rem; padding: .6rem .8rem; border-top: 1px solid #2b2e38; }
  .chat-input textarea {
    flex: 1; resize: none; background: #0d1015; border: 1px solid #2b2e38; border-radius: 7px;
    color: #e9ebf0; font: inherit; font-size: .85rem; padding: .4rem .55rem; height: 2.4rem; max-height: 7rem;
  }
  .chat-input textarea:focus { outline: none; border-color: #7fd1e8; }
  .chat-input button {
    background: #7fd1e8; color: #0b0c10; border: 0; border-radius: 7px; padding: 0 .9rem;
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .chat-input button:disabled { opacity: .4; cursor: default; }

  /* -- Fullscreen ----------------------------------------------------------------------------------
     Stacked above the microphone button and styled like it, on the same topmost layer as the
     decisions, so it stays reachable during a presentation. Hidden where the browser cannot do
     fullscreen for a page at all (an iPhone). */
  #fullscreen-btn {
    position: fixed; right: 26px; bottom: 92px; z-index: 2147483647;
    width: 54px; height: 54px; border-radius: 50%; border: 2px solid currentColor;
    background: rgba(10,10,14,.7); color: #e5e5e5; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: .6; transition: opacity .15s ease, transform .15s ease;
  }
  #fullscreen-btn:hover, #fullscreen-btn:focus-visible { opacity: 1; transform: scale(1.07); }
  #fullscreen-btn:focus-visible { outline: 2px solid #7fd1e8; outline-offset: 3px; }
  #fullscreen-btn svg { width: 22px; height: 22px; }
  #fullscreen-btn .exit { display: none; }
  #fullscreen-btn.active .enter { display: none; }
  #fullscreen-btn.active .exit { display: block; }

  /* -- Decisions waiting for you ---------------------------------------------------------------
     An agent asking to change its name or responsibility, or a machine the hub has no record of.
     Top centre, and above everything -- the face and a running presentation included: the overlay
     sits at the highest z-index there is, so these take the same one and are moved to the very end
     of the document (renderDecisions), which puts them on top. Nothing on screen, least of all an agent's
     presentation, may cover a decision that waits for a person. A click only asks: the hub's own
     confirmation dialog states the decision, and nothing is decided before the user says yes there. */
  #decisions {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 2147483647;
    display: flex; flex-direction: column; gap: 10px;
    width: 440px; max-width: calc(100vw - 36px);
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
  }
  .decision {
    background: #12151b; border: 1px solid #2b2e38; border-top: 3px solid #f2a62c;
    border-radius: 11px; padding: .8rem .95rem; box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .decision h2 { margin: 0 0 .2rem; font-size: .95rem; color: #e9ebf0; font-weight: 600; }
  .decision .machine { color: #6d7484; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .55rem; }
  .decision dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: .3rem .8rem; font-size: .84rem; }
  .decision dt { color: #99a0ae; }
  .decision dd { margin: 0; color: #e9ebf0; overflow-wrap: anywhere; }
  .decision .was { display: block; color: #6d7484; text-decoration: line-through; }
  .decision .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: .8rem; }
  .decision button {
    border-radius: 7px; padding: .38rem 1rem; font: inherit; font-size: .85rem; font-weight: 600;
    cursor: pointer; border: 1px solid #2b2e38;
  }
  .decision .accept { background: #6ee7a8; color: #0b0c10; border-color: #6ee7a8; }
  .decision .decline { background: none; color: #e9ebf0; }
  .decision .decline:hover { border-color: #ff8a5c; }
  .decision button:disabled { opacity: .45; cursor: default; }
  .decision button:focus-visible { outline: 2px solid #7fd1e8; outline-offset: 2px; }
  .decision .err { color: #ff8a5c; font-size: .78rem; margin-top: .55rem; }
  .decision .err.wait { color: #7fd1e8; }

  /* -- What this agent may do -------------------------------------------------------------------
     Above the fullscreen button, same look. An amber dot on it when this device has no dialog to
     confirm a change with. Only this device's own page can ask for a change (overlay-server.js), and
     none counts until the operating system's own dialog has named it and the user said yes there
     (device-confirm.js). */
  #perm-btn {
    position: fixed; right: 26px; bottom: 158px; z-index: 2147483647;
    width: 54px; height: 54px; border-radius: 50%; border: 2px solid currentColor;
    background: rgba(10,10,14,.7); color: #e5e5e5; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: .6; transition: opacity .15s ease, transform .15s ease;
  }
  #perm-btn:hover, #perm-btn:focus-visible, #perm-btn.open { opacity: 1; }
  #perm-btn:hover, #perm-btn:focus-visible { transform: scale(1.07); }
  #perm-btn:focus-visible { outline: 2px solid #7fd1e8; outline-offset: 3px; }
  #perm-btn svg { width: 23px; height: 23px; }
  #perm-btn.warn::after {
    content: ''; position: absolute; top: 3px; right: 3px; width: 11px; height: 11px;
    border-radius: 50%; background: #f2a62c; box-shadow: 0 0 0 2px #0a0a0e;
  }

  #perm-panel {
    position: fixed; right: 96px; bottom: 26px; z-index: 2147483647;
    width: 410px; max-width: calc(100vw - 36px); max-height: calc(100vh - 52px);
    background: #12151b; border: 1px solid #2b2e38; border-radius: 11px;
    display: none; flex-direction: column; overflow: hidden;
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #perm-panel.open { display: flex; }
  /* Signed out: a bar along the top edge. Deliberately not a dialog -- the agent is reachable and
     everything else on the page still works, it just cannot think until it is signed in again. */
  #login-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2147483647;
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    padding: .55rem .8rem; background: #2a1d12; border-bottom: 1px solid #5a3a1c;
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    font-size: .82rem; color: #f0d8c0;
  }
  #login-bar .login-text { flex: 1; min-width: 12rem; line-height: 1.4; }
  #login-bar .login-link { color: #ffcf9b; text-decoration: underline; word-break: break-all; max-width: 100%; }
  #login-bar .login-code {
    background: #140f0a; border: 1px solid #5a3a1c; border-radius: 7px; padding: .4rem .55rem;
    color: #f4e7d8; font-family: inherit; font-size: .82rem; min-width: 14rem; flex: 1;
  }
  #login-bar .login-code:focus { outline: none; border-color: #ffcf9b; }
  /* The join form of a machine that has not been paired yet. Centred rather than tucked into a
     corner: at that moment it is the only thing on the page worth looking at. */
  #join-panel {
    position: fixed; inset: 0; z-index: 2147483647; display: flex;
    align-items: center; justify-content: center; padding: 18px;
    background: rgba(8,9,12,.82); font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
  }
  .join-card {
    width: 400px; max-width: 100%; background: #12151b; border: 1px solid #2b2e38;
    border-radius: 11px; padding: 1rem 1.05rem 1.05rem; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    display: flex; flex-direction: column; gap: .75rem;
  }
  .join-title { color: #e9ebf0; font-size: 1.02rem; font-weight: 600; }
  .join-intro { color: #c3c8d2; font-size: .82rem; line-height: 1.5; }
  .join-row { display: flex; flex-direction: column; gap: .3rem; }
  .join-row span { color: #99a0ae; font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; }
  .join-row input {
    background: #0b0d12; border: 1px solid #2b2e38; border-radius: 7px; padding: .5rem .6rem;
    color: #e9ebf0; font-size: .92rem; font-family: inherit;
  }
  .join-row input:focus { outline: none; border-color: #4d94ff; }
  #join-code { font-variant-numeric: tabular-nums; letter-spacing: .08em; text-transform: uppercase; }
  .join-foot { display: flex; align-items: center; gap: .6rem; }
  .join-msg { flex: 1; font-size: .78rem; line-height: 1.4; color: #ff8a5c; min-height: 1em; }
  .join-msg.ok { color: #6ee7a8; }
  .join-msg.wait { color: #7fd1e8; }
  @media (max-width: 560px) {
    #perm-panel { left: 12px; right: 12px; bottom: 12px; width: auto; max-width: none; max-height: calc(100vh - 24px); }
  }
  .perm-head {
    display: flex; align-items: center; gap: .5rem; padding: .65rem .8rem;
    border-bottom: 1px solid #2b2e38; color: #e9ebf0; font-size: .92rem; font-weight: 600;
  }
  .perm-head .close {
    margin-left: auto; background: none; border: 0; color: #99a0ae; cursor: pointer;
    font-size: 1.1rem; line-height: 1; padding: 0 .2rem; font-family: inherit;
  }
  .perm-head .close:hover { color: #e9ebf0; }
  .perm-state {
    display: flex; gap: .55rem; align-items: flex-start; padding: .6rem .8rem;
    font-size: .8rem; line-height: 1.45; color: #c3c8d2; border-bottom: 1px solid #2b2e38;
  }
  .perm-state .dot { margin-top: .38rem; }
  .perm-state.warn .dot { background: #f2a62c; }
  .perm-state.bad .dot { background: #ff8a5c; }
  .perm-state a { color: #7fd1e8; }
  .perm-state.wait .dot { background: #6d7484; }
  .perm-list { overflow-y: auto; padding: .25rem 0; }
  .perm-item {
    display: grid; grid-template-columns: auto 1fr; column-gap: .65rem; row-gap: .1rem;
    padding: .42rem .8rem; cursor: pointer; align-items: start;
  }
  .perm-item:hover { background: rgba(127,209,232,.05); }
  .perm-item.locked { cursor: default; }
  .perm-item.locked:hover { background: none; }
  .perm-item input { width: 16px; height: 16px; margin: .12rem 0 0; accent-color: #7fd1e8; cursor: inherit; }
  .perm-item .label { color: #e9ebf0; font-size: .86rem; }
  .perm-item.locked .label { color: #99a0ae; }
  .perm-item .note { grid-column: 2; color: #6d7484; font-size: .74rem; line-height: 1.4; }
  .perm-item.danger .label { color: #ff8a5c; }
  .perm-item.danger .note { color: #c98a76; }
  .perm-item.danger input { accent-color: #ff8a5c; }
  .perm-item .changed { color: #f2a62c; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; margin-left: .35rem; }
  .perm-foot { display: flex; gap: .6rem; align-items: center; padding: .6rem .8rem; border-top: 1px solid #2b2e38; }
  .perm-foot .note { flex: 1; font-size: .76rem; color: #99a0ae; min-height: 1.1em; }
  .perm-foot .note.ok { color: #6ee7a8; }
  .perm-foot .note.bad { color: #ff8a5c; }
  .perm-btn-primary {
    background: #7fd1e8; color: #0b0c10; border: 1px solid #7fd1e8; border-radius: 7px; padding: .38rem .95rem;
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .perm-btn-quiet {
    background: none; color: #e9ebf0; border: 1px solid #2b2e38; border-radius: 7px; padding: .38rem .8rem;
    font: inherit; font-size: .85rem; cursor: pointer; white-space: nowrap;
  }
  .perm-btn-primary:disabled, .perm-btn-quiet:disabled { opacity: .4; cursor: default; }
  .perm-btn-primary:focus-visible, .perm-btn-quiet:focus-visible { outline: 2px solid #7fd1e8; outline-offset: 2px; }

  /* -- A newer version of this agent's own program ------------------------------------------------
     Top right, only while there is something to do or to know (updater.js). Checking, being current
     and having no network stay quiet. Same topmost layer as the decisions. */
  #update-note {
    position: fixed; top: 18px; right: 18px; z-index: 2147483647;
    width: 330px; max-width: calc(100vw - 36px); box-sizing: border-box;
    display: flex; flex-direction: column; gap: .45rem;
    background: #12151b; border: 1px solid #2b2e38; border-top: 3px solid #7fd1e8; border-radius: 11px;
    padding: .75rem .9rem; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; color: #e9ebf0;
  }
  #update-note .update-title { font-size: .92rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
  #update-note .update-title .close { margin-left: auto; background: none; border: 0; color: #99a0ae; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0 .2rem; font-family: inherit; }
  #update-note .update-title .close:hover { color: #e9ebf0; }
  #update-note .update-body { font-size: .8rem; line-height: 1.45; color: #c3c8d2; }
  #update-note .update-meta { font-size: .72rem; color: #6d7484; font-variant-numeric: tabular-nums; }
  #update-note .update-actions { display: flex; gap: .6rem; align-items: center; }
  #update-note .update-msg { flex: 1; font-size: .76rem; color: #ff8a5c; min-height: 1em; }
  #update-note .update-msg.wait { color: #7fd1e8; }
</style>
</head>
<body>

<!-- The face, served by this machine's own agent rather than injected by a browser extension.
     AGENT_SERVER_ORIGIN tells the script which server it belongs to; without it the script falls
     back to localhost, which is what it needs as a Tampermonkey userscript on foreign pages.
     Loading it here means any browser shows the face with nothing installed -- which is the only
     practical option on a phone, and one less moving part everywhere else. -->
<script>window.AGENT_SERVER_ORIGIN = location.origin;</script>
<script src="/agent-face-overlay.user.js"></script>

<div id="drop-rail" class="hidden"><div class="rail-title">Agents</div></div>
<button id="self-chat-btn" class="chat-btn" type="button" hidden>write…</button>

<div id="decisions" aria-live="polite"></div>

<button id="fullscreen-btn" type="button" title="Fullscreen" aria-label="Fullscreen" hidden>
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>

<button id="perm-btn" type="button" title="What this agent may do" aria-label="What this agent may do" aria-controls="perm-panel" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
</button>

<div id="perm-panel" role="dialog" aria-labelledby="perm-title">
  <div class="perm-head"><span id="perm-title">What this agent may do</span><button class="close" type="button" aria-label="Close">×</button></div>
  <div class="perm-state" id="perm-state"><span class="dot"></span><span id="perm-state-text">Loading…</span></div>
  <div class="perm-list" id="perm-list"></div>
  <div class="perm-foot">
    <span class="note" id="perm-note"></span>
    <button class="perm-btn-quiet" id="perm-undo" type="button" hidden>Undo</button>
    <button class="perm-btn-primary" id="perm-save" type="button" hidden>Save</button>
  </div>
</div>

<div id="update-note" role="status" hidden></div>

<!-- A bar across the top, shown only while this machine's Claude is signed out (claude-login.js).
     Until this existed, an expired login could only be fixed from a terminal on the device. -->
<div id="login-bar" role="status" hidden>
  <span class="login-text" id="login-text"></span>
  <a class="login-link" id="login-link" target="_blank" rel="noreferrer noopener" hidden></a>
  <input class="login-code" id="login-code" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the code from the browser" hidden>
  <button class="perm-btn-primary" id="login-go" type="button">Sign in</button>
</div>

<!-- Shown only on a machine that does not belong to a network yet (join-mode.js). It is the whole
     interface at that point: the face behind it is the generic one, because there is no agent yet. -->
<div id="join-panel" hidden>
  <div class="join-card">
    <div class="join-title">Join a network</div>
    <div class="join-intro" id="join-intro">This device is not part of a network yet.</div>
    <label class="join-row"><span>Hub address</span><input id="join-host" type="text" inputmode="decimal" autocomplete="off" placeholder="192.168.178.90"></label>
    <label class="join-row"><span>Name for this device</span><input id="join-name" type="text" autocomplete="off" spellcheck="false" placeholder="timo"></label>
    <label class="join-row"><span>Pairing code</span><input id="join-code" type="text" autocomplete="off" spellcheck="false" placeholder="K7QF-2M9X-BTLR"></label>
    <div class="join-foot">
      <span class="join-msg" id="join-msg"></span>
      <button class="perm-btn-primary" id="join-go" type="button">Join</button>
    </div>
  </div>
</div>

<div id="chat">
  <div class="chat-head"><span class="dot"></span><span id="chat-name"></span><button class="close" type="button" aria-label="Close">×</button></div>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-input">
    <textarea id="chat-text" rows="1" placeholder="Type a message… (Enter sends)"></textarea>
    <button id="chat-send" type="button">Send</button>
  </div>
</div>

<script>
(function () {
  const rail = document.getElementById('drop-rail');
  const cards = new Map(); // agent name -> element

  function makeCard(agent) {
    const el = document.createElement('div');
    el.className = 'agent' + (agent.online ? '' : ' off');
    el.innerHTML = '<div class="name"><span class="dot"></span><span class="n"></span></div>' +
                   '<div class="hint"></div><div class="status"></div>' +
                   '<div class="row"><button class="chat-btn" type="button">write…</button></div>' +
                   '<input type="file" multiple>';
    el.querySelector('.n').textContent = agent.name;
    el.querySelector('.hint').textContent = agent.online ? 'drop files or click' : 'offline';
    // Stops the click from also reaching the card, which would open the file picker.
    el.querySelector('.chat-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (el.dataset.online) openChat(el.dataset.name);
    });

    const picker = el.querySelector('input');
    const status = el.querySelector('.status');

    async function send(files) {
      if (!el.dataset.online) return;
      let done = 0, failed = 0;
      for (const f of files) {
        status.className = 'status go';
        status.textContent = files.length > 1 ? `sending ${done + failed + 1}/${files.length}…` : `sending ${f.name}…`;
        try {
          const r = await fetch('/upload?agent=' + encodeURIComponent(el.dataset.name) + '&name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
          const j = await r.json().catch(() => ({ ok: r.ok }));
          if (r.ok && j.ok !== false) done++; else { failed++; status.dataset.err = j.error || 'failed'; }
        } catch (e) { failed++; status.dataset.err = 'failed'; }
      }
      status.className = 'status ' + (failed ? 'bad' : 'ok');
      status.textContent = failed ? (status.dataset.err || 'failed') : (done > 1 ? done + ' files delivered' : 'delivered');
      setTimeout(() => { if (status.textContent) { status.textContent = ''; status.className = 'status'; } }, 6000);
    }

    ['dragenter', 'dragover'].forEach((ev) => el.addEventListener(ev, (e) => {
      e.preventDefault(); if (el.dataset.online) el.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach((ev) => el.addEventListener(ev, () => el.classList.remove('over')));
    el.addEventListener('drop', (e) => { e.preventDefault(); send(e.dataTransfer.files); });
    el.addEventListener('click', () => { if (el.dataset.online) picker.click(); });
    picker.addEventListener('change', () => { send(picker.files); picker.value = ''; });

    return el;
  }

  function apply(agents) {
    if (!agents.length) { rail.classList.add('hidden'); return; }
    rail.classList.remove('hidden');
    for (const a of agents) {
      let el = cards.get(a.name);
      if (!el) { el = makeCard(a); cards.set(a.name, el); rail.appendChild(el); }
      // Updated in place rather than redrawn, so a status message survives the refresh below.
      el.dataset.name = a.name;
      el.dataset.online = a.online ? '1' : '';
      el.classList.toggle('off', !a.online);
      el.querySelector('.hint').textContent = a.online ? 'drop files or click' : 'offline';
    }
    for (const [name, el] of cards) {
      if (!agents.some((a) => a.name === name)) { el.remove(); cards.delete(name); }
    }
  }

  async function load() {
    try {
      const r = await fetch('/agents');
      if (!r.ok) throw new Error('no');
      apply(await r.json());
    } catch (e) {
      // No /agents route means this is a node, not the hub -- nodes have nothing to hand out, so
      // the rail simply never appears and the page stays the plain black stage it always was.
      rail.classList.add('hidden');
    }
  }

  // Light every target up as soon as a file is dragged anywhere over the window.
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    dragDepth++; rail.classList.add('dragging');
  });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; rail.classList.remove('dragging'); } });
  window.addEventListener('drop', (e) => { dragDepth = 0; rail.classList.remove('dragging'); e.preventDefault(); });
  window.addEventListener('dragover', (e) => e.preventDefault()); // stop the browser opening the file

  // -- Typing to an agent ------------------------------------------------------------------
  // A second websocket alongside the face overlay's own. It subscribes to the chat stream, which
  // the server sends ONLY to subscribers -- the overlay must never receive these messages, since
  // it parses everything it gets as face state.
  const panel = document.getElementById('chat');
  const logEl = document.getElementById('chat-log');
  const nameEl = document.getElementById('chat-name');
  const textEl = document.getElementById('chat-text');
  const sendBtn = document.getElementById('chat-send');
  const history = new Map(); // agent -> [{from, text}], so switching panels keeps each thread
  let openAgent = null;
  let socket = null;

  function connect() {
    socket = new WebSocket('ws://' + location.host);
    socket.onopen = () => {
      socket.send(JSON.stringify({ type: 'subscribe-chat' }));
      refreshPermissions();
      refreshUpdate();
      refreshJoin();
      refreshLogin();
    };
    socket.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m && m.type === 'page-reply') { const done = waiting.get(m.reqId); if (done) { waiting.delete(m.reqId); done(m); } return; }
      if (m && m.type === 'permissions' && m.status) { showPermissions(m.status); return; }
      if (m && m.type === 'update' && m.update) { showUpdate(m.update); return; }
      if (m && m.type === 'join' && m.join) { showJoin(m.join); return; }
      if (m && m.type === 'login' && m.login) { showLogin(m.login); return; }
      if (m && m.type === 'decisions' && Array.isArray(m.list)) { renderDecisions(m.list); return; }
      // A state broadcast carries no type. On a node it says whether this device's own agent takes typed text.
      if (m && m.type === undefined && typeof m.status === 'string') { syncSelfChat(m); return; }
      if (!m || m.type !== 'chat' || !m.agent) return;
      // "you" entries are echoed back by the server, but the panel already showed them optimistically.
      if (m.from === 'you') { markSent(m.agent, m.text); return; }
      add(m.agent, m.from, m.text);
    };
    socket.onclose = () => setTimeout(connect, 2000);
    socket.onerror = () => {};
  }

  function add(agent, from, text) {
    const thread = history.get(agent) || [];
    thread.push({ from, text });
    history.set(agent, thread);
    if (openAgent === agent) render();
  }

  // The optimistic line stops being greyed out once the server confirms it took the message.
  function markSent(agent, text) {
    const thread = history.get(agent) || [];
    for (let i = thread.length - 1; i >= 0; i--) {
      if (thread[i].from === 'you' && thread[i].text === text && thread[i].pending) { thread[i].pending = false; break; }
    }
    if (openAgent === agent) render();
  }

  function render() {
    const thread = history.get(openAgent) || [];
    logEl.innerHTML = '';
    if (!thread.length) {
      const p = document.createElement('div');
      p.className = 'chat-empty';
      p.textContent = 'Nothing yet. Anything you type here goes straight to ' + openAgent + ' — no name needed.';
      logEl.appendChild(p);
      return;
    }
    for (const m of thread) {
      const d = document.createElement('div');
      d.className = 'msg ' + m.from + (m.pending ? ' pending' : '');
      d.textContent = m.text;
      logEl.appendChild(d);
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  function openChat(agent) {
    openAgent = agent;
    nameEl.textContent = agent;
    keepAboveOverlay(panel); // before the focus below -- moving a focused element would drop it
    panel.classList.add('open');
    render();
    textEl.focus();
  }

  function closeChat() { panel.classList.remove('open'); openAgent = null; }

  // The face overlay hangs its elements off <html> itself, after <body> -- its presentation frame among
  // them, which covers the whole page while something is shown. At the same (topmost) z-index, document
  // order decides, so whatever must stay usable during a presentation has to come after the overlay.
  // Moved only when part of the overlay is behind it: moving the chat box while someone types in it would
  // take the focus out of the text field. Found 2026-11-12: the chat button vanished under Steve's
  // presentation, exactly when the owner wanted to write to him.
  function keepAboveOverlay(el) {
    const kids = Array.from(document.documentElement.children);
    const at = kids.indexOf(el);
    const overlayAfter = kids.slice(at + 1).some((k) => k.id === 'agent-presentation-frame' || k.id === 'agent-face-overlay');
    if (at === -1 || overlayAfter) document.documentElement.appendChild(el);
  }

  // The one chat box a node offers: for the agent of this device (chatHere, overlay-server.js).
  const selfBtn = document.getElementById('self-chat-btn');
  let selfAgent = null;
  function syncSelfChat(s) {
    selfAgent = s.chatHere === true && typeof s.agent === 'string' && s.agent ? s.agent : null;
    selfBtn.hidden = !selfAgent;
    if (selfAgent) keepAboveOverlay(selfBtn);
    if (selfAgent) selfBtn.textContent = `write to ${selfAgent}…`;
  }
  selfBtn.addEventListener('click', () => { if (selfAgent) openChat(selfAgent); });

  function send() {
    const text = textEl.value.trim();
    if (!text || !openAgent) return;
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      add(openAgent, 'system', 'Not connected right now -- the page reconnects by itself.');
      return;
    }
    const thread = history.get(openAgent) || [];
    thread.push({ from: 'you', text, pending: true });
    history.set(openAgent, thread);
    socket.send(JSON.stringify({ type: 'user-input', text, agent: openAgent }));
    textEl.value = '';
    textEl.style.height = '';
    render();
  }

  // -- Fullscreen --------------------------------------------------------------------------------
  // The whole document goes fullscreen, not the face: the overlay's elements hang off <html> itself,
  // and the presentation frame, the decisions and this button have to come along.
  const fsBtn = document.getElementById('fullscreen-btn');
  const root = document.documentElement;
  const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  function syncFullscreen() {
    const on = !!fsElement();
    fsBtn.classList.toggle('active', on);
    fsBtn.title = on ? 'Leave fullscreen' : 'Fullscreen';
    fsBtn.setAttribute('aria-label', fsBtn.title);
  }
  if (fsSupported) {
    fsBtn.hidden = false;
    // Same topmost layer as the overlay, so document order decides -- see renderDecisions below.
    root.appendChild(fsBtn);
    fsBtn.addEventListener('click', () => {
      if (fsElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const request = root.requestFullscreen || root.webkitRequestFullscreen;
        const result = request.call(root, { navigationUI: 'hide' });
        if (result && result.catch) result.catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', syncFullscreen);
    document.addEventListener('webkitfullscreenchange', syncFullscreen);
    syncFullscreen();
  }

  // -- Decisions ---------------------------------------------------------------------------------
  // Everything in a card is set with textContent: the name, responsibility and reason come from an
  // agent, and here they are only ever words to read.
  const decisionsEl = document.getElementById('decisions');
  const decisionNotes = new Map(); // card id -> { text, wait }: what a card shows while and after asking
  let lastDecisions = [];

  function addRow(dl, label, value, was) {
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    if (was !== undefined) {
      const old = document.createElement('span');
      old.className = 'was';
      old.textContent = was || '(nothing)';
      dd.appendChild(old);
    }
    dd.appendChild(document.createTextNode(value || '(nothing)'));
    dl.append(dt, dd);
  }

  function renderDecisions(list) {
    // Same z-index as the face overlay, so document order decides and the last one wins. The overlay
    // appends its elements to <html> itself, after <body> (see mount() in agent-face-overlay.user.js),
    // so the end of the body is not late enough -- found in the browser, where the face's frame
    // still cut through the buttons.
    if (document.documentElement.lastElementChild !== decisionsEl) document.documentElement.appendChild(decisionsEl);
    lastDecisions = list;
    for (const id of decisionNotes.keys()) {
      if (!list.some((d) => d.id === id)) decisionNotes.delete(id);
    }
    decisionsEl.innerHTML = '';
    for (const d of list) {
      const card = document.createElement('div');
      card.className = 'decision';
      const title = document.createElement('h2');
      const machine = document.createElement('div');
      machine.className = 'machine';
      machine.textContent = 'Machine: ' + d.machine;
      const dl = document.createElement('dl');
      if (d.kind === 'request') {
        title.textContent = d.currentName + ' asks for a change';
        if (d.name !== d.currentName) addRow(dl, 'Name', d.name, d.currentName);
        if (d.domain !== d.currentDomain) addRow(dl, 'Responsible for', d.domain, d.currentDomain);
        addRow(dl, 'Reason', d.reason);
      } else {
        title.textContent = 'Not confirmed yet';
        addRow(dl, 'Name', d.name || d.currentName);
        addRow(dl, 'Responsible for', d.domain);
      }
      const actions = document.createElement('div');
      actions.className = 'actions';
      const decline = document.createElement('button');
      decline.type = 'button'; decline.className = 'decline'; decline.textContent = 'Decline';
      const accept = document.createElement('button');
      accept.type = 'button'; accept.className = 'accept'; accept.textContent = 'Accept';
      const err = document.createElement('div');
      err.className = 'err';
      err.hidden = true;
      const shown = decisionNotes.get(d.id);
      if (shown) {
        err.hidden = false;
        err.className = 'err' + (shown.wait ? ' wait' : '');
        err.textContent = shown.text;
        accept.disabled = decline.disabled = !!shown.wait;
      }
      // A click only asks. The hub's own confirmation dialog states what this card decides, and the card
      // waits for its answer here -- kept by id, since a fresh list may redraw the card meanwhile.
      const answer = async (yes) => {
        decisionNotes.set(d.id, { text: 'Confirm in the dialog that opens. It names exactly what happens -- if it says anything else, cancel.', wait: true });
        renderDecisions(lastDecisions);
        try {
          const r = await request('decide', { id: d.id, accept: yes }, CONFIRM_WAIT_MS);
          if (r.error) throw new Error(r.error);
          decisionNotes.delete(d.id);
        } catch (e) {
          decisionNotes.set(d.id, { text: e.message });
        }
        renderDecisions(lastDecisions);
      };
      accept.addEventListener('click', () => answer(true));
      decline.addEventListener('click', () => answer(false));
      actions.append(decline, accept);
      card.append(title, machine, dl, actions, err);
      decisionsEl.appendChild(card);
    }
  }

  // -- What this agent may do -----------------------------------------------------------------------
  // The page shows the switches and says which ones the user wants -- it is trusted with nothing more. An
  // agent allowed to control the browser can run script here and reword anything on this page, so the
  // agent's own process words the change itself and has the operating system confirm it in a dialog that
  // names it (permissions.js, device-confirm.js). The decision cards above work the same way.
  const CONFIRM_WAIT_MS = 170000; // a little longer than the dialog may stay open
  const waiting = new Map(); // reqId -> resolve
  let requestCounter = 0;
  function request(type, data, timeoutMs) {
    return new Promise((resolve, reject) => {
      if (!socket || socket.readyState !== WebSocket.OPEN) { reject(new Error('Not connected right now. Try again in a moment.')); return; }
      const reqId = 'q' + (++requestCounter) + '-' + Math.random().toString(36).slice(2, 10);
      const timer = setTimeout(() => { waiting.delete(reqId); reject(new Error('No answer from this device. Is it up to date?')); }, timeoutMs || 15000);
      waiting.set(reqId, (m) => { clearTimeout(timer); resolve(m); });
      socket.send(JSON.stringify(Object.assign({}, data, { type, reqId })));
    });
  }

  const permBtn = document.getElementById('perm-btn');
  const permPanel = document.getElementById('perm-panel');
  const permTitle = document.getElementById('perm-title');
  const permState = document.getElementById('perm-state');
  const permStateText = document.getElementById('perm-state-text');
  const permList = document.getElementById('perm-list');
  const permNote = document.getElementById('perm-note');
  const permSave = document.getElementById('perm-save');
  const permUndo = document.getElementById('perm-undo');
  let permStatus = null; // as the device last reported it
  let permDraft = null;  // key -> boolean, only while something is being changed
  let permBusy = false;
  root.appendChild(permBtn); // the same topmost layer as the fullscreen button

  function note(text, kind) {
    permNote.className = 'note' + (kind ? ' ' + kind : '');
    permNote.textContent = text;
  }

  async function refreshPermissions() {
    try {
      const m = await request('permissions-get', {});
      if (m.status) showPermissions(m.status);
    } catch (e) { /* an agent from before permissions: the button stays plain */ }
  }

  function showPermissions(status) {
    permStatus = status;
    if (permDraft && status.items.every((it) => permDraft[it.key] === it.value)) permDraft = null;
    const confirm = status.confirm || {};
    permBtn.classList.toggle('warn', !!confirm.checked && !confirm.available);
    if (permPanel.classList.contains('open')) renderPermissions();
  }

  function values() {
    const v = {};
    for (const it of permStatus.items) v[it.key] = permDraft && it.key in permDraft ? !!permDraft[it.key] : it.value;
    return v;
  }
  const isDirty = () => !!permDraft && permStatus.items.some((it) => !!permDraft[it.key] !== it.value);

  function renderPermissions() {
    const s = permStatus;
    if (!s) return;
    const confirm = s.confirm || {};
    const canChange = !!confirm.available;
    permTitle.textContent = 'What ' + s.agentName + ' may do';
    permState.className = 'perm-state' + (!confirm.checked ? ' wait' : canChange ? '' : ' warn');
    permStateText.textContent = !confirm.checked
      ? 'Checking how changes can be confirmed on this device…'
      : canChange
        ? 'Every change is confirmed with ' + confirm.label + ', in a dialog outside the browser that names exactly what changes. Nothing counts before that.'
        : (confirm.problem || 'This device has no confirmation dialog.') + ' Nothing can be changed here until then.';

    const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
    permList.textContent = '';
    const v = values();
    for (const it of s.items) {
      const row = document.createElement('label');
      row.className = 'perm-item' + (it.danger ? ' danger' : '') + (canChange ? '' : ' locked');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = v[it.key];
      box.disabled = !canChange || permBusy;
      box.dataset.key = it.key;
      box.addEventListener('change', () => {
        permDraft = Object.assign(values(), { [it.key]: box.checked });
        note('');
        renderPermissions();
      });
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = it.label;
      if (permDraft && v[it.key] !== it.value) {
        const changed = document.createElement('span');
        changed.className = 'changed';
        changed.textContent = 'changed';
        label.appendChild(changed);
      }
      row.append(box, label);
      if (it.danger || it.note) {
        const text = document.createElement('span');
        text.className = 'note';
        text.textContent = it.danger || it.note;
        row.appendChild(text);
      }
      permList.appendChild(row);
      if (focused === it.key) box.focus();
    }

    const dirty = isDirty();
    permSave.hidden = !canChange;
    permSave.disabled = permBusy || !dirty;
    permUndo.hidden = !dirty;
    permUndo.disabled = permBusy;
  }

  function setBusy(busy) {
    permBusy = busy;
    renderPermissions();
  }

  function openPermissions() {
    root.appendChild(permPanel); // last in the document, so nothing on the same layer covers it
    permPanel.classList.add('open');
    permBtn.classList.add('open');
    permBtn.setAttribute('aria-expanded', 'true');
    if (!permBusy) note('');
    if (permStatus) renderPermissions();
    refreshPermissions().then(() => {
      if (!permStatus) permStateText.textContent = 'This agent does not offer permissions yet. It needs the latest update.';
    });
  }
  function closePermissions() {
    permPanel.classList.remove('open');
    permBtn.classList.remove('open');
    permBtn.setAttribute('aria-expanded', 'false');
    if (!permBusy) permDraft = null; // closing drops unsaved changes
  }

  permBtn.addEventListener('click', () => (permPanel.classList.contains('open') ? closePermissions() : openPermissions()));
  permPanel.querySelector('.close').addEventListener('click', closePermissions);
  permPanel.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePermissions(); });
  permUndo.addEventListener('click', () => { permDraft = null; note(''); renderPermissions(); });
  permSave.addEventListener('click', async () => {
    if (!permStatus || permBusy) return;
    const label = (permStatus.confirm && permStatus.confirm.label) || 'the confirmation dialog';
    setBusy(true);
    note('Confirm with ' + label + '. The dialog names exactly what changes -- if it says anything else, cancel.');
    try {
      const r = await request('permissions-save', { permissions: values() }, CONFIRM_WAIT_MS);
      if (r.error) throw new Error(r.error);
      permDraft = null;
      note(r.unchanged ? 'Nothing to change.' : 'Saved. ' + permStatus.agentName + ' works with these from its next answer on.', 'ok');
    } catch (e) {
      note(e.message, 'bad');
    } finally {
      setBusy(false);
    }
  });

  // -- A newer version of this agent's own program --------------------------------------------------
  // The agent checks by itself (updater.js); this only shows what it found. Installing goes through this
  // device's confirmation dialog, which names the version -- the button alone installs nothing.
  const updateEl = document.getElementById('update-note');
  let updateState = null;
  let updateBusy = false;
  let updateMsg = { text: '', wait: false };
  let updateDismissed = '';
  root.appendChild(updateEl); // the same topmost layer as the other notices

  async function refreshUpdate() {
    try {
      const m = await request('update-get', {});
      if (m.update) showUpdate(m.update);
    } catch (e) { /* an agent from before updates: nothing to show */ }
  }

  function showUpdate(update) {
    updateState = update;
    renderUpdate();
  }

  function renderUpdate() {
    const u = updateState;
    const version = u && u.latest ? u.latest.version : '';
    const key = u ? u.status + ' ' + version : '';
    const shown = !!u && ['available', 'manual', 'git-update', 'installing', 'restarting', 'installed'].includes(u.status) && updateDismissed !== key;
    updateEl.hidden = !shown;
    if (!shown) return;
    updateEl.textContent = '';
    const name = u.agentName;

    const title = document.createElement('div');
    title.className = 'update-title';
    const titleText = document.createElement('span');
    titleText.textContent = { available: 'Update available', manual: 'Update needs a manual step', 'git-update': 'Update available', installing: 'Installing update', restarting: 'Update installed', installed: 'Update installed' }[u.status];
    title.appendChild(titleText);
    if (u.status !== 'installing' && u.status !== 'restarting') {
      const close = document.createElement('button');
      close.type = 'button'; close.className = 'close'; close.textContent = '×'; close.setAttribute('aria-label', 'Hide until the next version');
      close.addEventListener('click', () => { updateDismissed = key; renderUpdate(); });
      title.appendChild(close);
    }

    const body = document.createElement('div');
    body.className = 'update-body';
    body.textContent = {
      available: 'Version ' + version + ' of ' + name + '\'s program is ready, ' + u.changedCount + ' files. It installs after you confirm it, and ' + name + ' restarts once it is idle.',
      manual: 'Version ' + version + ' changes ' + u.manual.join(', ') + ', which cannot be replaced while ' + name + ' is running. Install it by hand.',
      'git-update': 'Version ' + version + ' of ' + name + '\'s program is out, ' + u.changedCount + ' files. This copy came from git' + (u.autoUpdate ? ' and brings it in by itself as soon as ' + name + ' is idle.' : ': installing it fast-forwards this folder to the published version.'),
      installing: 'Downloading and checking version ' + version + '…',
      restarting: 'Version ' + version + ' is in place. ' + name + ' restarts as soon as it is idle.',
      installed: 'Version ' + version + ' is in place. Restart ' + name + ' to use it: close its window and start it again.'
    }[u.status];

    const meta = document.createElement('div');
    meta.className = 'update-meta';
    meta.textContent = 'Installed: ' + (u.installed || 'a version from before updates') + (u.latest && u.latest.published ? ' · new one published ' + String(u.latest.published).slice(0, 10) : '');

    updateEl.append(title, body, meta);
    if (u.status === 'available' || u.status === 'git-update') {
      const actions = document.createElement('div');
      actions.className = 'update-actions';
      const msg = document.createElement('span');
      msg.className = 'update-msg' + (updateMsg.wait ? ' wait' : '');
      msg.textContent = updateMsg.text;
      const install = document.createElement('button');
      install.type = 'button'; install.className = 'perm-btn-primary'; install.textContent = 'Install';
      install.disabled = updateBusy;
      install.addEventListener('click', installUpdate);
      actions.append(msg, install);
      updateEl.appendChild(actions);
    }
  }

  async function installUpdate() {
    if (updateBusy) return;
    updateBusy = true;
    const label = (permStatus && permStatus.confirm && permStatus.confirm.label) || 'the confirmation dialog';
    updateMsg = { text: 'Confirm with ' + label + '. The dialog names the version -- if it says anything else, cancel.', wait: true };
    renderUpdate();
    try {
      const r = await request('update-install', {}, CONFIRM_WAIT_MS + 120000);
      updateMsg = { text: r.error || '', wait: false };
      if (r.update) updateState = r.update;
    } catch (e) {
      updateMsg = { text: e.message, wait: false };
    } finally {
      updateBusy = false;
      renderUpdate();
    }
  }

  // -- Signing this machine's Claude back in (claude-login.js) -----------------------------------
  const loginBar = document.getElementById('login-bar');
  const loginText = document.getElementById('login-text');
  const loginLink = document.getElementById('login-link');
  const loginCode = document.getElementById('login-code');
  const loginGo = document.getElementById('login-go');
  let loginState = null;
  let loginBusy = false;
  let loginDoneTimer = null;
  root.appendChild(loginBar);

  async function refreshLogin() {
    try {
      const m = await request('login-get', {});
      if (m.login) showLogin(m.login);
    } catch (e) { /* an agent from before this existed */ }
  }

  function showLogin(login) {
    loginState = login;
    const name = (permStatus && permStatus.agentName) || 'This agent';
    const busyFlow = login.status === 'starting' || login.status === 'waiting' || login.status === 'submitted';
    loginBar.hidden = !(login.needed || busyFlow || login.status === 'done');
    if (loginBar.hidden) return;

    const line = {
      idle: name + ' is signed out of Claude and cannot answer until it is signed in again.',
      starting: 'Opening the sign-in…',
      waiting: '1. Open this address and sign in. 2. Copy the code it shows you. 3. Paste it here and press Send code.',
      submitted: 'Checking the code…',
      done: 'Signed in. ' + name + ' can answer again — ask once more.',
      failed: login.message || 'That did not work.'
    }[login.status] || (login.message || '');
    loginText.textContent = login.message && login.status !== 'waiting' && login.status !== 'done' ? login.message : line;

    // Nothing left to do once it worked: the bar says so and then gets out of the way.
    if (login.status === 'done' && !loginDoneTimer) {
      loginDoneTimer = setTimeout(() => { loginDoneTimer = null; if (loginState && loginState.status === 'done') loginBar.hidden = true; }, 8000);
    }
    const showUrl = login.status === 'waiting' && !!login.url;
    loginLink.hidden = !showUrl;
    if (showUrl) { loginLink.href = login.url; loginLink.textContent = login.url; }
    loginCode.hidden = !showUrl;
    loginGo.hidden = login.status === 'done' || login.status === 'submitted';
    loginGo.textContent = showUrl ? 'Send code' : 'Sign in';
    loginGo.disabled = loginBusy || !login.available;
    if (!login.available) loginText.textContent = login.message
      || (name + ' is signed out, and this machine cannot run the sign-in from here. Sign in in its own window.');
  }

  // Asks again for a little while after each step. The agent pushes every change by itself, so this
  // only matters when a push is missed -- which it was, for an afternoon, because the line that
  // routes those pushes was missing and the bar simply sat at "Checking the code…" forever.
  function pollLogin(untilDone) {
    let left = 15;
    const timer = setInterval(async () => {
      left -= 1;
      if (left <= 0) { clearInterval(timer); return; }
      try {
        const m = await request('login-get', {});
        if (!m.login) return;
        showLogin(m.login);
        if (untilDone(m.login)) clearInterval(timer);
      } catch (e) { /* the agent is restarting, say -- the next tick tries again */ }
    }, 2000);
  }

  async function loginAction() {
    if (loginBusy || !loginState) return;
    loginBusy = true;
    loginGo.disabled = true;
    try {
      const waiting = loginState.status === 'waiting';
      const r = waiting
        ? await request('login-code', { code: loginCode.value.trim() }, 60000)
        : await request('login-start', {}, 60000);
      if (r.error) { loginText.textContent = r.error; }
      if (r.login) showLogin(r.login);
      if (waiting && !r.error) {
        loginCode.value = '';
        pollLogin((s) => s.status === 'done' || s.status === 'failed' || s.status === 'idle');
      } else if (!r.error) {
        pollLogin((s) => !!s.url || s.status === 'failed');
      }
    } catch (e) {
      loginText.textContent = e.message;
    } finally {
      loginBusy = false;
      if (loginState) showLogin(loginState);
    }
  }

  loginGo.addEventListener('click', loginAction);
  loginCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); loginAction(); } });

  // -- Joining a network (join-mode.js) ----------------------------------------------------------
  // Only ever shown on a machine that has not been paired yet. The agent on the other side of this
  // socket is not an agent at all then -- it is the join mode, and this form is all it can do.
  const joinPanel = document.getElementById('join-panel');
  const joinHost = document.getElementById('join-host');
  const joinName = document.getElementById('join-name');
  const joinCode = document.getElementById('join-code');
  const joinGo = document.getElementById('join-go');
  const joinMsg = document.getElementById('join-msg');
  const joinIntro = document.getElementById('join-intro');
  let joinBusy = false;
  let joinPort = 8788;
  root.appendChild(joinPanel);

  async function refreshJoin() {
    try {
      const m = await request('join-get', {});
      if (m.join) showJoin(m.join);
    } catch (e) { /* a machine that is already part of a network never answers this */ }
  }

  function setJoinMsg(text, kind) {
    joinMsg.textContent = text || '';
    joinMsg.className = 'join-msg' + (kind ? ' ' + kind : '');
  }

  function showJoin(join) {
    joinPanel.hidden = false;
    joinPort = join.defaultPort || joinPort;
    if (join.hub) {
      // Filled in, never acted on by itself: the user sees the address before anything is sent, and
      // the pairing code is what actually decides who this machine ends up trusting.
      if (!joinHost.value || joinHost.dataset.fromBeacon === '1') {
        joinHost.value = join.hub.host;
        joinHost.dataset.fromBeacon = '1';
      }
      if (join.hub.port) joinPort = join.hub.port;
      joinIntro.textContent = 'A hub called "' + join.hub.hubName + '" is at ' + join.hub.host
        + '. Ask it for a pairing code, then enter it here.';
    }
    joinGo.disabled = joinBusy || join.status === 'joining' || join.status === 'joined';
    if (join.status === 'joining') setJoinMsg(join.message || 'Pairing…', 'wait');
    else if (join.status === 'joined') {
      setJoinMsg((join.message || 'Paired.') + (join.restartable ? ' Starting as a full agent…' : ' Start it again to bring it up.'), 'ok');
    } else if (join.message) setJoinMsg(join.message, '');
  }

  async function joinNetwork() {
    if (joinBusy) return;
    joinBusy = true;
    joinGo.disabled = true;
    setJoinMsg('Pairing…', 'wait');
    try {
      const r = await request('join-submit', {
        host: joinHost.value.trim(), port: joinPort,
        name: joinName.value.trim().toLowerCase(), code: joinCode.value.trim()
      }, 90000);
      if (r.error) { setJoinMsg(r.error, ''); joinGo.disabled = false; }
      else if (r.join) showJoin(r.join);
    } catch (e) {
      setJoinMsg(e.message, '');
      joinGo.disabled = false;
    } finally {
      joinBusy = false;
    }
  }

  joinGo.addEventListener('click', joinNetwork);
  for (const el of [joinHost, joinName, joinCode]) {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); joinNetwork(); } });
  }

  sendBtn.addEventListener('click', send);
  panel.querySelector('.close').addEventListener('click', closeChat);
  textEl.addEventListener('keydown', (e) => {
    // Enter sends, Shift+Enter is a newline -- the convention everyone already expects.
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    if (e.key === 'Escape') closeChat();
  });
  textEl.addEventListener('input', () => {
    textEl.style.height = 'auto';
    textEl.style.height = Math.min(textEl.scrollHeight, 112) + 'px';
  });

  connect();
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
